<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Awesome Interface</title>
<style>
  :root {
    color-scheme: light;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #111;
  }
  .page {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px 40px 64px;
  }
  header {
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    color: #111;
  }
  header p {
    margin: 4px 0 0;
    font-size: 14px;
    color: #9a9a9a;
  }
  .cards {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 40px;
    margin-top: 48px;
    flex-wrap: wrap;
  }
  .card {
    position: relative;
    display: block;
    width: 420px;
    height: 235px;
    border-radius: 14px;
    overflow: hidden;
    flex-shrink: 0;
    text-decoration: none;
  }
  /* Village Chronicles card */
  .card-village {
    background:
      radial-gradient(1px 1px at 20% 15%, rgba(255,255,255,0.9) 0%, transparent 60%),
      radial-gradient(1px 1px at 60% 10%, rgba(255,255,255,0.7) 0%, transparent 60%),
      radial-gradient(1px 1px at 80% 25%, rgba(255,255,255,0.8) 0%, transparent 60%),
      radial-gradient(1px 1px at 35% 8%, rgba(255,255,255,0.6) 0%, transparent 60%),
      radial-gradient(1px 1px at 90% 12%, rgba(255,255,255,0.9) 0%, transparent 60%),
      radial-gradient(1px 1px at 10% 30%, rgba(255,255,255,0.5) 0%, transparent 60%),
      linear-gradient(180deg, #0b0e1a 0%, #14101a 45%, #201410 75%, #2b1a10 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-village span {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px;
    letter-spacing: 2px;
    color: #d8b158;
    text-transform: uppercase;
  }
  /* Stickman Archive card */
  .card-stickman {
    background: #ffffff;
  }
  .card-stickman .title {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 30px;
    font-weight: 800;
    color: #111;
    white-space: nowrap;
  }
  .stickman {
    position: absolute;
    width: 18px;
    height: 18px;
    color: #111;
  }
  /* Abyssal Odyssey card */
  .card-ocean {
    background: linear-gradient(180deg, #062a4a 0%, #0b3d63 40%, #146089 75%, #1c85ad 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-ocean .title {
    position: relative;
    z-index: 2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #eaf6ff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.35);
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.35);
  }
  .wave {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -2px;
    width: 100%;
    height: auto;
    display: block;
  }
  /* Tower Overwatch card */
  .card-tower {
    background: linear-gradient(180deg, #07090f 0%, #0e1220 45%, #2a2030 72%, #6b4426 92%, #8a5528 100%);
  }
  .card-tower .scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .card-tower .title {
    position: absolute;
    top: 50%;
    left: 43%;
    transform: translate(-50%, -50%);
    z-index: 2;
    font-family: "Arial Narrow", Impact, "Helvetica Neue", sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ffb454;
    white-space: nowrap;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  /* Downhill card */
  .card-downhill {
    background: #14171f;
  }
  .card-downhill .scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .card-downhill .title {
    position: absolute;
    top: 50%;
    left: 30%;
    transform: translate(-50%, -50%);
    z-index: 2;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ddd5c6;
    white-space: nowrap;
  }
  .more-soon {
    text-align: center;
    color: #9a9a9a;
    font-size: 14px;
    margin-top: 96px;
  }
  footer {
    text-align: center;
    color: #b3b3b3;
    font-size: 13px;
    margin-top: 32px;
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Awesome Interface</h1>
      <p>Awesome Games</p>
    </header>

    <div class="cards">
      <a class="card card-village" href="https://villagechronicles.awesomeinterface.com/">
        <span>Village Chronicles</span>
      </a>

      <a class="card card-stickman" href="https://stickmanarchive.awesomeinterface.com/">
        <div class="title">Stickman Archive</div>
      </a>

      <a class="card card-ocean" href="https://oceanodyssey.awesomeinterface.com/">
        <svg class="wave" viewBox="0 0 420 40" preserveAspectRatio="none">
          <path d="M0,20 C60,40 120,0 180,18 C240,36 300,4 360,20 C390,28 405,24 420,18 L420,40 L0,40 Z" fill="rgba(255,255,255,0.10)"></path>
          <path d="M0,28 C70,10 130,38 200,24 C260,12 320,34 420,14 L420,40 L0,40 Z" fill="rgba(255,255,255,0.16)"></path>
        </svg>
        <div class="title">Abyssal Odyssey</div>
      </a>

      <a class="card card-tower" href="https://toweroverwatch.awesomeinterface.com/">
        <svg class="scene" viewBox="0 0 420 235" preserveAspectRatio="none" aria-hidden="true">
          <!-- scope reticle -->
          <g stroke="#ece8de" stroke-opacity="0.5" fill="none" stroke-width="1">
            <circle cx="181" cy="117" r="62"/>
            <line x1="101" y1="117" x2="161" y2="117"/>
            <line x1="201" y1="117" x2="261" y2="117"/>
            <line x1="181" y1="45" x2="181" y2="97"/>
            <line x1="181" y1="137" x2="181" y2="189"/>
          </g>
          <circle cx="181" cy="117" r="2" fill="#ff4d45"/>
        </svg>
        <div class="title">Tower Overwatch</div>
      </a>

      <a class="card card-downhill" href="https://downhill.awesomeinterface.com/">
        <svg class="scene" viewBox="0 0 420 235" preserveAspectRatio="none" aria-hidden="true">
          <!-- mountains -->
          <path d="M0 150 L80 95 L135 140 L215 70 L330 150 L420 120 V235 H0Z" fill="#1d2c3f"/>
          <!-- skateboard + mannequin (from app icon) -->
          <g transform="translate(220 22) scale(0.45)">
            <g transform="rotate(-8 256 367)">
              <rect x="150" y="352" width="212" height="30" rx="15" fill="#14b8a6"/>
              <circle cx="188" cy="400" r="20" fill="#ff5a36"/>
              <circle cx="330" cy="400" r="20" fill="#ff5a36"/>
            </g>
            <g stroke="#ddd5c6" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path d="M256 178 L256 262"/>
              <path d="M256 262 L226 300 L212 346"/>
              <path d="M256 262 L290 300 L304 336"/>
              <path d="M256 200 L206 232 L180 214"/>
              <path d="M256 200 L312 228 L336 206"/>
            </g>
            <circle cx="256" cy="136" r="38" fill="#ddd5c6"/>
          </g>
        </svg>
        <div class="title">Downhill</div>
      </a>
    </div>

    <p class="more-soon">More coming soon&hellip;</p>

    <footer>&copy; 2026 Awesome Interface. All rights reserved.</footer>
  </div>

  <script>
    (function () {
      var svg =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">' +
        '<circle cx="12" cy="4" r="2.2"/>' +
        '<line x1="12" y1="6.5" x2="12" y2="15"/>' +
        '<line x1="12" y1="9" x2="6" y2="7"/>' +
        '<line x1="12" y1="9" x2="18" y2="7"/>' +
        '<line x1="12" y1="15" x2="7" y2="22"/>' +
        '<line x1="12" y1="15" x2="17" y2="22"/>' +
        '</svg>';

      var positions = [
        [8, 5], [22, 3], [37, 12], [38, 8], [58, 2], [78, 4], [95, 10],
        [4, 22], [15, 30], [30, 26], [48, 32], [63, 24], [90, 28],
        [2, 45], [12, 52], [25, 48], [38, 55], [50, 46], [67, 52], [83, 44],
        [8, 68], [20, 72], [35, 75], [55, 66], [70, 78], [88, 70]
      ];

      var card = document.querySelector('.card-stickman');
      positions.forEach(function (pos, i) {
        var wrap = document.createElement('div');
        wrap.className = 'stickman';
        wrap.style.left = pos[0] + '%';
        wrap.style.top = pos[1] + '%';
        var rotation = (i * 37) % 40 - 20;
        wrap.style.transform = 'rotate(' + rotation + 'deg)';
        wrap.innerHTML = svg;
        card.appendChild(wrap);
      });

      var bubbles = [
        [6, 20, 10], [14, 60, 6], [22, 35, 14], [30, 75, 8],
        [40, 15, 7], [48, 55, 11], [55, 85, 6], [62, 30, 9],
        [70, 65, 13], [78, 10, 6], [85, 45, 8], [92, 78, 10]
      ];
      var ocean = document.querySelector('.card-ocean');
      bubbles.forEach(function (b) {
        var el = document.createElement('div');
        el.className = 'bubble';
        el.style.left = b[0] + '%';
        el.style.top = b[1] + '%';
        el.style.width = b[2] + 'px';
        el.style.height = b[2] + 'px';
        ocean.insertBefore(el, ocean.firstChild);
      });
    })();
  </script>
</body>
</html>
